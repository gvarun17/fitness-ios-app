# Xcode project definition. Run `xcodegen` after adding or removing files;
# the generated Fitness.xcodeproj is committed so Xcode users can just open it.
name: Fitness
options:
  bundleIdPrefix: com.gvarun17
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set your Apple team in Xcode: Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
packages:
  FitnessCore:
    path: Packages/FitnessCore
targets:
  Fitness:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: FitnessCore
      - target: FitnessWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fitness Coach
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: >-
          Fitness Coach reads your workouts, steps, heart rate, HRV and sleep from Apple Health
          to show your progress and coach you. Your data stays on this iPhone.
        CFBundleURLTypes:
          - CFBundleURLName: com.gvarun17.fitness
            CFBundleURLSchemes: [fitnesscoach]
    entitlements:
      path: App/Fitness.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.com.gvarun17.fitness]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gvarun17.fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  FitnessWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: FitnessCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Fitness Coach
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/FitnessWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gvarun17.fitness]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gvarun17.fitness.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
schemes:
  Fitness:
    build:
      targets:
        Fitness: all
        FitnessWidgets: all
    test:
      targets:
        - package: FitnessCore/FitnessCoreTests
